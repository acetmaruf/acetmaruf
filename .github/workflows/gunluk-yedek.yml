name: günlük kayıt yedeği

# Bilgisayardaki günlük kayıt (gunluk-katki.sh) o gün hiç çalışmadıysa
# GUNLUK.md'ye o günün kaydını buradan yazar. Çalıştıysa hiçbir şey yapmaz.
on:
  schedule:
    # 19.00 ve 21.00 Türkiye saati. GitHub zamanlaması saatlerce gecikebiliyor
    # (21 Ekim'deki çalışma 3 saat geç başladı), bu yüzden erken başlıyor.
    - cron: "0 16 * * *"
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gunluk-yedek
  cancel-in-progress: false

jobs:
  yedek:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TZ: Europe/Istanbul
    steps:
      - uses: actions/checkout@v4

      - name: Bugünün kaydı var mı bak, yoksa yaz
        run: |
          AYLAR=(Ocak Şubat Mart Nisan Mayıs Haziran Temmuz Ağustos Eylül Ekim Kasım Aralık)
          # Gece yarısından sonra başladıysa yeni günün kaydını açma, onu bilgisayar yazar.
          if [ "$((10#$(date +%H)))" -lt 6 ]; then
            echo "Saat $(date +%H.%M), gecikmiş çalışma. Yeni günün kaydı açılmadı."
            exit 0
          fi
          GUN=$(date +%Y-%m-%d)
          AY_NO=$((10#$(date +%m)))
          BASLIK="## $((10#$(date +%d))) ${AYLAR[$((AY_NO-1))]} $(date +%Y)"

          if grep -qxF "$BASLIK" GUNLUK.md; then
            echo "$GUN kaydı zaten var, yedeğe gerek yok."
            exit 0
          fi

          python3 - "$BASLIK" <<'PY'
          import sys
          baslik = sys.argv[1]
          metin = open("GUNLUK.md", encoding="utf-8").read()
          bas, _, kalan = metin.partition("\n## ")
          yeni = bas.rstrip("\n") + "\n\n" + baslik + "\n\n- Bilgisayar başında değildim, kayıt bulut yedeğinden.\n"
          if kalan:
              yeni += "\n## " + kalan
          open("GUNLUK.md", "w", encoding="utf-8").write(yeni)
          PY

          git config user.name "Maruf Acet"
          git config user.email "marufacet@gmail.com"
          git add GUNLUK.md
          git commit -m "Çalışma günlüğü, $GUN"
          for deneme in 1 2 3; do
            git push origin HEAD:main && exit 0
            sleep 15
            git pull --rebase origin main
          done
          exit 1
