name: generate snake animation

on:
  # every day at 00:00 UTC
  schedule:
    - cron: "0 0 * * *"
  # allows running the job manually
  workflow_dispatch:
  # on every push to main
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=FF5A36&color_dots=#ebedf0,#FFE7A3,#FFCF33,#FF8A5B,#FF5A36
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=FFCF33&color_dots=#161b22,#4A3466,#7A4B8C,#FF8A5B,#FF5A36

      - name: push snake to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
